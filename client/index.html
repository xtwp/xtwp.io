<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Neon Snakes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD во время игры -->
  <div id="hud" class="hidden">
    <div id="score">Длина: <b id="scoreVal">0</b></div>
    <div id="kills">Убийств: <b id="killsVal">0</b></div>
  </div>
  <div id="leaderboard" class="hidden">
    <h3>Лидеры</h3>
    <ol id="lbList"></ol>
    <div id="online"></div>
  </div>
  <button id="boostBtn" class="hidden">Ускорение</button>

  <!-- Главное меню -->
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>Neon Snakes</h1>
      <input id="nameInput" type="text" maxlength="16" placeholder="Ваше имя" autocomplete="off">
      <button id="playBtn" disabled>Играть</button>
      <p id="status">Подключение к серверу…</p>
      <p class="hint">Мышь — направление. Зажмите левую кнопку или пробел — ускорение (тратит массу).</p>
    </div>
  </div>

  <!-- Экран смерти -->
  <div id="death" class="overlay hidden">
    <div class="panel">
      <h2>Вы разбились</h2>
      <p id="deathInfo"></p>
      <button id="againBtn">Играть снова</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="network.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
</body>
</html>
